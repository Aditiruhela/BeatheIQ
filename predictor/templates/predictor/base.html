<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}BreatheIQ{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #1c1c1c, #2c5364);
            color: white;
        }

        .navbar {
            background: rgba(0,0,0,0.6);
            padding: 12px 0;
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: bold;
        }

        .nav-link {
            color: white !important;
            font-size: 18px;
            margin-left: 15px;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #00c9ff !important;
        }

          footer {
            text-align: center;
            padding: 18px;
            background: #111;
            color: #aaa;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<style>
/* ===== NAVBAR WRAPPER ===== */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(12px);
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* BRAND */
.navbar-brand {
    font-size: 26px;
    font-weight: bold;
    color: #00c9ff !important;
    letter-spacing: 1px;
}

/* NAV LINKS */
.nav-link {
    color: #ddd !important;
    margin: 0 12px;
    font-size: 15px;
    position: relative;
    transition: 0.3s;
}

/* HOVER EFFECT (NETFLIX STYLE GLOW) */
.nav-link:hover {
    color: #00c9ff !important;
    transform: translateY(-2px);
}

/* UNDERLINE ANIMATION */
.nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0%;
    height: 2px;
    background: #00c9ff;
    transition: 0.3s;
}

.nav-link:hover::after {
    width: 100%;
}

/* ACTIVE LINK STYLE */
.nav-link.active {
    color: #00c9ff !important;
}

/* BUTTON STYLE (optional login/contact etc) */
.nav-btn {
    background: linear-gradient(135deg, #00c9ff, #0072ff);
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    color: white;
    font-size: 14px;
    transition: 0.3s;
}

.nav-btn:hover {
    transform: scale(1.05);
}
</style>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">

    <!-- BRAND -->
    <a class="navbar-brand" href="/">🌍BreatheIQ</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>

        {% comment %} <li class="nav-item">
          <a class="nav-link" href="/predict">AQI Live</a>
        </li> {% endcomment %}

        <li class="nav-item">
          <a class="nav-link" href="/disease">ML Predictor</a>
        </li>

        {% comment %} <li class="nav-item">
          <a class="nav-link" href="/result">City Compare</a>
        </li> {% endcomment %}

        <li class="nav-item">
          <a class="nav-link" href="/about">About</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/contact">Contact</a>
        </li>

      </ul>

    </div>
  </div>
</nav>
<!-- PAGE CONTENT -->
{% block content %}
{% endblock %}

<!-- FOOTER -->
<footer>
    © 2026 AQI Disease Predictor | Mini Project
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
